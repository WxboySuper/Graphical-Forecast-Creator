<div class="promo" role="region" aria-label="{{ promoName }}">
 <p class="promo-long"><strong>{{ promoName }}:</strong> your first year of Premium for {{ promoAnnualPrice }} with code <b>{{ promoCode }}</b>. Ends {{ promoEndsLabel }}. <a href="/pricing/">See pricing</a></p>
 <p class="promo-short"><a href="/pricing/">Premium {{ promoAnnualPrice }} first year · code <b>{{ promoCode }}</b></a></p>
 <button class="promo-close" id="promoClose" type="button" aria-label="Dismiss the deal banner">&times;</button>
</div>
