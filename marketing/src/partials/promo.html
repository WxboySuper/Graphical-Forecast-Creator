<div class="promo" role="region" aria-label="{{ promoName }}">
 <p class="promo-text"><span class="promo-long"><strong>{{ promoName }}:</strong> your first year of Premium for {{ promoAnnualPrice }} with code <b>{{ promoCode }}</b>. Ends {{ promoEndsLabel }}.</span><span class="promo-short">{{ promoAnnualPrice }} first year · code <b>{{ promoCode }}</b></span></p>
 <a class="promo-cta" href="{{ appUrl }}/account">Get the deal</a>
 <button class="promo-close" id="promoClose" type="button" aria-label="Dismiss the deal banner">&times;</button>
</div>
