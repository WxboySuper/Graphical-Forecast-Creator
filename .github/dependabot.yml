# Dependabot version updates target main, the next-major integration line.
# Minor and patch updates share one PR. Major updates stay individual so
# migrations can be handled when there is time to review them.

version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /server
    target-branch: main
    schedule:
      interval: weekly
    patterns:
      - "*"
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
