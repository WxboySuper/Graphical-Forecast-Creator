name: Debug | OCR endpoint probe

# THROWAWAY diagnostic. Bisects the gateway 400 by sending payload variants
# with the real key and printing each response body. Delete this file/branch
# once the culprit field is identified. Never merged to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send payload variants, print status and body
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -u
          URL="https://opencode.ai/zen/go/v1/responses"
          INPUT='[{"type":"message","role":"user","content":[{"type":"input_text","text":"Reply with the word ok."}]}'
          TOOLS='[{"type":"function","name":"probe_fn","description":"probe","parameters":{"type":"object","properties":{}}}]'

          send() {
            local name="$1"; shift
            echo "===== variant: $name ====="
            curl -s -w "\nHTTP:%{http_code}\n" "$URL" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "$1"
            echo ""
          }

          send "minimal" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT}"
          send "plus-store-false" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"store\":false}"
          send "plus-include" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"include\":[\"reasoning.encrypted_content\"]}"
          send "plus-prompt-cache-key" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"prompt_cache_key\":\"probe123\"}"
          send "plus-tools" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"tools\":$TOOLS}"
          send "plus-max-output-tokens" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"max_output_tokens\":64}"
