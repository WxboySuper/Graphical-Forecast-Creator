name: Review | OCR trial

# Side-by-side trial with the existing OpenCode first-look reviewer.
# Non-interference design:
# - Own concurrency group (ocr-<pr>), so neither reviewer cancels the other.
# - Own sticky summary marker from the OCR action, distinct from
#   gfc-opencode-first-look-summary. Neither overwrites the other.
# - Own manual trigger (/ocr), distinct from /review-opencode.
# - Non-blocking: no merge gate yet. Compare quality first, gate later.
#
# Model: Muse Spark via the OpenCode Go subscription endpoint, reusing
# OPENCODE_API_KEY (same key works for Go and Zen; Go is the flat
# subscription, Zen is pay-per-use). Muse Spark serves the OpenAI Responses
# API, so llm_protocol is openai-responses and the URL ends in /responses,
# NOT /chat/completions.
# Override without editing YAML via repo Variables:
#   OCR_LLM_URL, OCR_LLM_MODEL, OCR_LLM_PROTOCOL.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request_target'
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && startsWith(github.event.comment.body, '/ocr')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
        && format('gfc-ocr-trial-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('gfc-ocr-trial-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request_target'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && startsWith(github.event.comment.body, '/ocr')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve PR refs for comment or dispatch triggers
        id: pr-refs
        if: github.event_name != 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = Number(
              context.payload.issue?.number ?? context.payload.inputs?.pr_number,
            );
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('No valid PR number for the OCR trial review.');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pull.base.ref);
            core.setOutput('head_sha', pull.head.sha);

      - name: Run OCR review with Muse Spark
        id: ocr
        uses: alibaba/open-code-review@357c3f09a264563ab64d8f4fc3b25b186cd3c4a4 # main as of 2026-10-10
        with:
          llm_url: ${{ vars.OCR_LLM_URL || 'https://opencode.ai/zen/go/v1/responses' }}
          llm_auth_token: ${{ secrets.OPENCODE_API_KEY }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'muse-spark-1.3-contributor' }}
          llm_use_anthropic: 'false'
          llm_protocol: ${{ vars.OCR_LLM_PROTOCOL || 'openai-responses' }}
          language: English
          effort: high
          review_task_timeout: '20'
          sticky_summary: 'true'
          incremental: 'false'
          resolve_outdated: 'false'
          upload_artifacts: 'true'
          rule: .opencodereview/rule.json
          base_ref: ${{ steps.pr-refs.outputs.base_ref }}
          head_sha: ${{ steps.pr-refs.outputs.head_sha }}
          pr_number: ${{ steps.pr-refs.outputs.pr_number }}

      - name: Trial summary
        if: always()
        run: |
          {
            echo "OCR trial outcome=${{ steps.ocr.outcome }}.";
            if [ "${{ steps.ocr.outcome }}" = "success" ]; then
              echo "OCR trial posted. Compare with the first-look comment on the same PR.";
            else
              echo "OCR trial did NOT post (outcome=${{ steps.ocr.outcome }}). No comparison available for this run.";
            fi
            echo "inline=${{ steps.ocr.outputs.comments_inline }} total=${{ steps.ocr.outputs.comments_total }} failed=${{ steps.ocr.outputs.comments_failed }} summary=${{ steps.ocr.outputs.summary_comment_url }}";
          } >> "$GITHUB_STEP_SUMMARY"
