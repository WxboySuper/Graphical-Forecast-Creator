name: Review | OCR trial

# Side-by-side trial with the existing OpenCode first-look reviewer.
# Non-interference design:
# - Own concurrency group (ocr-<pr>), so neither reviewer cancels the other.
# - Own sticky summary marker from the OCR action, distinct from
#   gfc-opencode-first-look-summary. Neither overwrites the other.
# - Own manual trigger (/ocr), distinct from /review-opencode.
# - Blocking by design: the gate step fails this check whenever the review
#   posts findings or any bot-authored inline thread is left unresolved, and
#   the Main Ruleset additionally requires review-thread resolution. Picky
#   by design: effort high, full-range re-review every push, maximum-strict
#   rules in .opencodereview/rule.json. If the reviewer proves noisy rather
#   than useful, relax the rules or drop the gate before touching the ruleset.
#
# Model: Muse Spark via the OpenCode Go subscription endpoint, reusing
# OPENCODE_API_KEY (same key works for Go and Zen; Go is the flat
# subscription, Zen is pay-per-use). Muse Spark serves the OpenAI Responses
# API, so llm_protocol is openai-responses and the URL ends in /responses,
# NOT /chat/completions.
# Override without editing YAML via repo Variables:
#   OCR_LLM_URL, OCR_LLM_MODEL, OCR_LLM_PROTOCOL.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request_target'
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && startsWith(github.event.comment.body, '/ocr')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
        && format('gfc-ocr-trial-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('gfc-ocr-trial-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request_target'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && startsWith(github.event.comment.body, '/ocr')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve PR refs for comment or dispatch triggers
        id: pr-refs
        if: github.event_name != 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = Number(
              context.payload.issue?.number ?? context.payload.inputs?.pr_number,
            );
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('No valid PR number for the OCR trial review.');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_ref', pull.base.ref);
            core.setOutput('head_sha', pull.head.sha);

      - name: Run OCR review with Muse Spark
        id: ocr
        uses: alibaba/open-code-review@357c3f09a264563ab64d8f4fc3b25b186cd3c4a4 # main as of 2026-10-10
        with:
          llm_url: ${{ vars.OCR_LLM_URL || 'https://opencode.ai/zen/go/v1/responses' }}
          llm_auth_token: ${{ secrets.OPENCODE_API_KEY }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'muse-spark-1.3-contributor' }}
          llm_use_anthropic: 'false'
          llm_protocol: ${{ vars.OCR_LLM_PROTOCOL || 'openai-responses' }}
          # Muse Spark speaks the OpenAI Responses API, which rejects the
          # action's default Anthropic-style extra_body
          # ({"thinking": {"type": "disabled"}}) with HTTP 400 on every
          # request (run 38203212106: 5/5 failed). Send an empty object.
          llm_extra_body: '{}'
          language: English
          effort: high
          review_task_timeout: '20'
          sticky_summary: 'true'
          incremental: 'false'
          resolve_outdated: 'false'
          upload_artifacts: 'true'
          rule: .opencodereview/rule.json
          base_ref: ${{ steps.pr-refs.outputs.base_ref }}
          head_sha: ${{ steps.pr-refs.outputs.head_sha }}
          pr_number: ${{ steps.pr-refs.outputs.pr_number }}

      - name: Enforce zero open OCR threads (merge gate)
        id: ocr-gate
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
          OCR_COMMENTS_TOTAL: ${{ steps.ocr.outputs.comments_total }}
          GATE_PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            // Fail-closed merge gate: the review must complete, post zero
            // findings, and leave zero unresolved bot-authored review threads.
            // Anything else fails this check. Note the Main Ruleset already
            // requires review-thread resolution, so unresolved inline threads
            // block merge even without this job in required_status_checks.
            const outcome = process.env.OCR_OUTCOME || 'unknown';
            if (outcome !== 'success') {
              core.setFailed(`OCR review did not complete (outcome=${outcome}). Fix the reviewer before merging.`);
              return;
            }
            const posted = Number(process.env.OCR_COMMENTS_TOTAL || '0');
            if (Number.isInteger(posted) && posted > 0) {
              core.setFailed(`OCR posted ${posted} finding(s) this run. Address or resolve every inline thread, then push again.`);
              return;
            }
            const prNumber = Number(
              process.env.GATE_PR_NUMBER
                || context.payload.pull_request?.number
                || context.payload.issue?.number,
            );
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('OCR gate could not resolve a PR number; failing closed.');
              return;
            }
            let cursor = null;
            let openBotThreads = 0;
            for (;;) {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $after) {
                        nodes {
                          isResolved
                          comments(first: 20) { nodes { author { login } } }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber,
                  after: cursor,
                },
              );
              const connection = data?.repository?.pullRequest?.reviewThreads;
              if (!connection) {
                core.setFailed('OCR gate could not read review threads; failing closed.');
                return;
              }
              for (const thread of connection.nodes ?? []) {
                const authors = (thread.comments?.nodes ?? []).map((c) => c?.author?.login);
                if (!thread.isResolved && authors.includes('github-actions[bot]')) {
                  openBotThreads += 1;
                }
              }
              if (!connection.pageInfo?.hasNextPage) break;
              if (connection.pageInfo.endCursor === cursor) {
                core.setFailed('OCR gate review-thread pagination did not advance; failing closed.');
                return;
              }
              cursor = connection.pageInfo.endCursor ?? null;
            }
            if (openBotThreads > 0) {
              core.setFailed(`${openBotThreads} unresolved reviewer thread(s) remain on PR #${prNumber}. Resolve every inline comment before merging.`);
              return;
            }
            core.info('OCR gate clean: review completed with no findings and no unresolved reviewer threads.');

      - name: Trial summary
        if: always()
        run: |
          {
            echo "OCR trial outcome=${{ steps.ocr.outcome }}.";
            if [ "${{ steps.ocr.outcome }}" = "success" ]; then
              echo "OCR trial posted. Compare with the first-look comment on the same PR.";
            else
              echo "OCR trial did NOT post (outcome=${{ steps.ocr.outcome }}). No comparison available for this run.";
            fi
            echo "inline=${{ steps.ocr.outputs.comments_inline }} total=${{ steps.ocr.outputs.comments_total }} failed=${{ steps.ocr.outputs.comments_failed }} summary=${{ steps.ocr.outputs.summary_comment_url }}";
          } >> "$GITHUB_STEP_SUMMARY"

  # TEMPORARY diagnostic job (throwaway branch only, never main). Bisects the
  # gateway 400 by sending payload variants with the real key and printing
  # each response body. Delete before merging anywhere.
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send payload variants, print status and body
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -u
          URL="https://opencode.ai/zen/go/v1/responses"
          INPUT='[{"type":"message","role":"user","content":[{"type":"input_text","text":"Reply with the word ok."}]}]'
          TOOLS='[{"type":"function","name":"probe_fn","description":"probe","parameters":{"type":"object","properties":{}}}]'

          send() {
            local name="$1"; shift
            echo "===== variant: $name ====="
            curl -s -w "\nHTTP:%{http_code}\n" "$URL" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "$1"
            echo ""
          }

          send "minimal" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT}"
          send "plus-store-false" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"store\":false}"
          send "plus-include" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"include\":[\"reasoning.encrypted_content\"]}"
          send "plus-prompt-cache-key" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"prompt_cache_key\":\"probe123\"}"
          send "plus-tools" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"tools\":$TOOLS}"
          send "plus-max-output-tokens" "{\"model\":\"muse-spark-1.3-contributor\",\"input\":$INPUT,\"max_output_tokens\":64}"
