name: Release | Beta

# Beta releases are intentional snapshots of the next-major main line. Merging
# into main never creates a release automatically; this workflow versions main,
# publishes a draft GitHub prerelease, deploys beta.gfcweather.com on Cloudflare
# Workers, deploys the mesoscale catalog Worker and the beta API on the VPS,
# smoke-tests, then publishes the release. A schedule every six hours runs the same pipeline
# when main has changed since the last beta tag.
on:
  schedule:
    # Beta cut every six hours (03:23, 09:23, 15:23, 21:23 UTC). The `changes` job skips the run when main has nothing new
    # since the latest beta tag (release-metadata commits do not count).
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit beta version (X.Y.Z-beta.N); leave blank to auto-increment'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Optional previous beta tag for generated release notes'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and preview release notes without committing, tagging, or deploying'
        required: false
        default: false
        type: boolean
      deploy_api:
        description: 'Deploy the beta analytics/API server on the VPS after the Worker deploy'
        required: false
        default: true
        type: boolean
      only_if_changed:
        description: 'Skip the release when main has no commits since the latest beta tag (ignored when an explicit version or dry run is requested)'
        required: false
        default: true
        type: boolean
      auth_backend:
        description: 'Keep Firebase until the beta Clerk+D1 migration is explicitly ready'
        required: true
        default: firebase
        type: choice
        options:
          - firebase
          - clerk-d1

concurrency:
  group: beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes since last beta
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.detect.outputs.proceed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main with the latest beta tag
        id: detect
        env:
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A manual run always proceeds when the caller asked for something specific: an explicit version, a dry run,
          # or the box unticked. Only a plain manual click and the scheduled cuts are skipped when nothing changed.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && { [ "$ONLY_IF_CHANGED" != "true" ] || [ -n "$EXPLICIT_VERSION" ] || [ "$DRY_RUN" = "true" ]; }; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git tag --list 'v*-beta.*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW=$(git log --format=%s "${LAST_TAG}..HEAD" | grep -vc '^chore(release): prepare' || true)
          echo "Commits on main since ${LAST_TAG} (excluding release metadata): ${NEW}"
          if [ "$NEW" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "No new changes since ${LAST_TAG}; skipping the automatic beta release." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.proceed == 'true'
    name: Lint and test main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Test the beta Worker API
        run: pnpm run test:beta-worker

  version_gate:
    name: Resolve beta version
    needs: quality
    if: >-
      !cancelled() &&
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      EXPLICIT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Calculate next beta version
        id: version
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { calculateNextBetaVersion } from './scripts/lib/calculate-next-beta-version.mjs';
          import { validateChangelogLaneForRelease } from './scripts/lib/changelog-lane-content.mjs';

          const explicit = process.env.EXPLICIT_VERSION?.trim() ?? '';
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tags = execFileSync('git', ['tag', '--list', 'v*-beta.*'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          validateChangelogLaneForRelease(readFileSync('CHANGELOG.md', 'utf8'), 'next-major');
          const { version, strategy } = calculateNextBetaVersion({
            packageVersion: current,
            betaTags: tags,
            explicitVersion: explicit,
            taggedVersions: new Set(tags),
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstrategy=${strategy}\n`);
          console.log(`Selected beta version ${version} (${strategy}).`);
          NODE

      - name: Preview beta package bump (dry run)
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-beta-release.mjs "$RELEASE_VERSION" --dry-run

      - name: Preview GitHub release notes (dry run)
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: prs
          NOTES_FILE: beta-release-notes.md
          DRY_RUN: true
        run: |
          set -euo pipefail
          node scripts/create-github-release.mjs "$RELEASE_VERSION" main
          if [ -f beta-release-notes.md ]; then
            echo '### Dry-run release notes preview' >> "$GITHUB_STEP_SUMMARY"
            cat beta-release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

  pre_build:
    name: Pre-release build (no Sentry upload)
    needs: version_gate
    if: >-
      !cancelled() &&
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version_gate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply target beta version for build validation
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Require Clerk publishable key for Clerk+D1
        if: inputs.auth_backend == 'clerk-d1'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ inputs.auth_backend == 'clerk-d1' && secrets.BETA_CLERK_PUBLISHABLE_KEY || '' }}
        run: |
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::BETA_CLERK_PUBLISHABLE_KEY is required for clerk-d1" >&2
            exit 1
          fi

      - name: Build beta frontend (validation only)
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_AUTH_BACKEND: ${{ inputs.auth_backend || 'firebase' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ inputs.auth_backend == 'clerk-d1' && secrets.BETA_CLERK_PUBLISHABLE_KEY || '' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_MESOSCALE_WORKER_URL_BETA: ${{ vars.MESOSCALE_WORKER_URL }}
          CI: false

  release:
    name: Commit version and create draft GitHub release
    needs: [version_gate, pre_build]
    if: >-
      !cancelled() &&
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.version_gate.result == 'success' &&
      needs.pre_build.result == 'success' &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version_gate.outputs.version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    env:
      RELEASE_VERSION: ${{ needs.version_gate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Prepare beta package version
        run: node scripts/prepare-beta-release.mjs "$RELEASE_VERSION"

      - name: Commit release metadata to main
        id: release_commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          if git diff --cached --quiet; then
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "::error::package.json is already ${RELEASE_VERSION} but HEAD moved since this workflow started; resolve manually." >&2
              exit 1
            fi
            echo "No package.json change; reusing the audited workflow commit for v${RELEASE_VERSION}."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(release): prepare ${RELEASE_VERSION}"
            git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        env:
          RELEASE_COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally." >&2
            exit 1
          fi
          git tag -a "$TAG" "$RELEASE_COMMIT_SHA" -m "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Create draft GitHub prerelease
        env:
          RELEASE_COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: beta-release-notes.md
          RELEASE_DRAFT: true
          RELEASE_VERIFY_TAG: true
        run: node scripts/create-github-release.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA"

  deploy:
    name: Deploy beta Worker
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Verify beta release tag and package version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "v${RELEASE_VERSION}" ]; then
            echo "::error::Release artifact version ${PKG} does not match v${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the pinned beta migration verifier
        if: inputs.auth_backend == 'clerk-d1'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/beta-migration-tools
          key: ${{ runner.os }}-beta-wrangler-4.149.0-node24

      - name: Build beta frontend
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_AUTH_BACKEND: ${{ inputs.auth_backend || 'firebase' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ inputs.auth_backend == 'clerk-d1' && secrets.BETA_CLERK_PUBLISHABLE_KEY || '' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_MESOSCALE_WORKER_URL_BETA: ${{ vars.MESOSCALE_WORKER_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: false

      - name: Verify Sentry sourcemap publication
        run: node scripts/verify-sentry-sourcemaps.mjs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy beta Worker and static assets
        id: deploy
        env:
          AUTH_BACKEND: ${{ inputs.auth_backend || 'firebase' }}
          BETA_WORKER_SHARED_SECRET: ${{ secrets.BETA_WORKER_SHARED_SECRET }}
          BETA_D1_DATABASE_ID: ${{ inputs.auth_backend == 'clerk-d1' && secrets.BETA_D1_DATABASE_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ inputs.auth_backend == 'clerk-d1' && secrets.BETA_CLERK_PUBLISHABLE_KEY || '' }}
          EXPECTED_BETA_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$BETA_WORKER_SHARED_SECRET" ]; then
            printf '%s' "$BETA_WORKER_SHARED_SECRET" | pnpm dlx wrangler@4.149.0 secret put BETA_WORKER_SHARED_SECRET --config cloudflare/wrangler.beta.jsonc
          fi
          if [ "$AUTH_BACKEND" = "clerk-d1" ]; then
            if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
              echo "::error::BETA_CLERK_PUBLISHABLE_KEY is required for clerk-d1" >&2
              exit 1
            fi
            if [ -z "$BETA_D1_DATABASE_ID" ]; then
              echo "::error::BETA_D1_DATABASE_ID is required for clerk-d1" >&2
              exit 1
            fi
            node scripts/prepare-beta-clerk-d1-config.mjs
            pnpm dlx wrangler@4.149.0 d1 export gfc-beta --remote --skip-confirmation --output beta-d1-backup.sql --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            BACKUP_KEY="d1-backups/${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql"
            pnpm dlx wrangler@4.149.0 r2 object put "gfc-beta-firestore-migration-snapshot/$BACKUP_KEY" --file beta-d1-backup.sql --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            pnpm dlx wrangler@4.149.0 r2 object get "gfc-beta-firestore-migration-snapshot/$BACKUP_KEY" --file beta-d1-backup-verified.sql --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            test -s beta-d1-backup-verified.sql || { echo "::error::D1 backup round-trip verification produced an empty file." >&2; exit 1; }
            cmp --silent beta-d1-backup.sql beta-d1-backup-verified.sql || { echo "::error::D1 backup round-trip mismatch." >&2; exit 1; }
            pnpm dlx wrangler@4.149.0 r2 object get gfc-beta-firestore-migration-snapshot/manifest.json --file beta-firestore-manifest.json --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            pnpm dlx wrangler@4.149.0 r2 object get gfc-beta-firestore-migration-snapshot/full-snapshot.jsonl --file beta-firestore-full-snapshot.jsonl --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            test -s beta-firestore-full-snapshot.jsonl || { echo "::error::Firestore full snapshot download produced an empty file." >&2; exit 1; }
            node --input-type=module - <<'NODE'
            import fs from 'node:fs';
            import readline from 'node:readline';
            import { createReadStream } from 'node:fs';
            const manifest = JSON.parse(fs.readFileSync('beta-firestore-manifest.json', 'utf8'));
            if (!process.env.EXPECTED_BETA_FIREBASE_PROJECT_ID || manifest.projectId !== process.env.EXPECTED_BETA_FIREBASE_PROJECT_ID
              || manifest.complete !== true || manifest.skippedNoEmailCount !== 0 || manifest.malformedLegacyCycleCount !== 0
              || !Array.isArray(manifest.accountFailures) || manifest.accountFailures.length !== 0
              || !Number.isInteger(manifest.fullSnapshotCount) || manifest.fullSnapshotCount < 1
              || !Number.isInteger(manifest.userSnapshotCount) || manifest.userSnapshotCount < 1
              || !Array.isArray(manifest.userSnapshotEmailHashes)
              || manifest.userSnapshotEmailHashes.length !== manifest.userSnapshotCount
              || manifest.userSnapshotEmailHashes.some((hash) => !/^[a-f0-9]{64}$/.test(hash))
              || new Set(manifest.userSnapshotEmailHashes).size !== manifest.userSnapshotEmailHashes.length) {
              throw new Error('Firestore snapshot manifest is incomplete or has skipped users/data.');
            }
            fs.writeFileSync('beta-firestore-email-hashes.txt', `${manifest.userSnapshotEmailHashes.join('\n')}\n`, { mode: 0o600 });
            let lines = 0;
            for await (const line of readline.createInterface({ input: createReadStream('beta-firestore-full-snapshot.jsonl'), crlfDelay: Infinity })) {
              if (line.trim()) { JSON.parse(line); lines += 1; }
            }
            if (lines !== manifest.fullSnapshotCount) throw new Error(`Full snapshot has ${lines} records; manifest expects ${manifest.fullSnapshotCount}.`);
            NODE
            SNAPSHOT_VERIFY_DIR=$(mktemp -d)
            trap 'rm -rf "$SNAPSHOT_VERIFY_DIR"' EXIT
            WRANGLER_BIN="$RUNNER_TEMP/beta-migration-tools/node_modules/.bin/wrangler"
            if [ ! -x "$WRANGLER_BIN" ]; then
              # One pinned install serves the complete per-email verification batch.
              for attempt in 1 2 3; do
                if npm install --prefix "$RUNNER_TEMP/beta-migration-tools" --no-save --no-package-lock wrangler@4.149.0; then break; fi
                if [ "$attempt" -eq 3 ]; then echo "::error::Unable to install the pinned Wrangler snapshot verifier after three attempts." >&2; exit 1; fi
                sleep "$((attempt * 3))"
              done
            fi
            export SNAPSHOT_VERIFY_DIR WRANGLER_BIN
            WRANGLER_CONFIG=cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            export WRANGLER_CONFIG
            xargs -r -P 4 -I '{}' bash -euo pipefail -c '
              EMAIL_HASH="$1"
              attempt=1
              until "$WRANGLER_BIN" r2 object get "gfc-beta-firestore-migration-snapshot/by-email/$EMAIL_HASH.json" --file "$SNAPSHOT_VERIFY_DIR/$EMAIL_HASH.json" --config "$WRANGLER_CONFIG"; do
                if [[ "$attempt" -ge 3 ]]; then echo "::error::Could not download snapshot for email hash $EMAIL_HASH." >&2; exit 1; fi
                sleep "$((attempt * 2))"
                attempt=$((attempt + 1))
              done
              test -s "$SNAPSHOT_VERIFY_DIR/$EMAIL_HASH.json" || { echo "::error::Snapshot for email hash $EMAIL_HASH is empty." >&2; exit 1; }
              node -e 'const fs=require("node:fs"), crypto=require("node:crypto"); const snapshot=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const email=typeof snapshot.email==="string"?snapshot.email.trim().toLowerCase():""; if (!email || !snapshot.uid || !snapshot.userProfile || crypto.createHash("sha256").update(email).digest("hex")!==process.argv[2]) process.exit(1)' "$SNAPSHOT_VERIFY_DIR/$EMAIL_HASH.json" "$EMAIL_HASH"
            ' _ '{}' < beta-firestore-email-hashes.txt
            pnpm dlx wrangler@4.149.0 d1 migrations list gfc-beta --remote --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            pnpm dlx wrangler@4.149.0 d1 migrations apply gfc-beta --remote --yes --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
            pnpm dlx wrangler@4.149.0 deploy --config cloudflare/wrangler.beta.clerk-d1.generated.jsonc
          else
            pnpm dlx wrangler@4.149.0 deploy --config cloudflare/wrangler.beta.jsonc
          fi

      - name: Print rollback command on deploy failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          AUTH_BACKEND: ${{ inputs.auth_backend }}
        run: |
          echo "::error::Worker deploy failed. After fixing the issue, redeploy with deploy-beta-workers.yml and ref=v${RELEASE_VERSION}."
          CONFIG="cloudflare/wrangler.beta.jsonc"
          if [ "$AUTH_BACKEND" = "clerk-d1" ]; then
            CONFIG="cloudflare/wrangler.beta.clerk-d1.generated.jsonc"
            echo "Set BETA_D1_DATABASE_ID in a repository checkout, then run: node scripts/prepare-beta-clerk-d1-config.mjs"
          fi
          echo "pnpm dlx wrangler@4.149.0 rollback --config $CONFIG"
          if [ "$AUTH_BACKEND" = "clerk-d1" ]; then
            BACKUP_KEY="d1-backups/${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql"
            echo "If D1 needs restoring, retrieve and verify d1-backups/${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql from R2, then run: pnpm dlx wrangler@4.149.0 r2 object get gfc-beta-firestore-migration-snapshot/$BACKUP_KEY --file beta-d1-backup-verified.sql --config $CONFIG && pnpm dlx wrangler@4.149.0 d1 execute gfc-beta --remote --file beta-d1-backup-verified.sql --config $CONFIG"
          fi

  deploy_mesoscale_worker:
    name: Deploy mesoscale catalog Worker
    needs: release
    # Opt-in: set the MESOSCALE_WORKER_URL repository variable (the Worker's public
    # https origin) and the R2_BUCKET secret to enable. See docs/operations/mesoscale-worker.md.
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry_run && vars.MESOSCALE_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Test Worker
        run: node --test "cloudflare/*.test.mjs"

      - name: Render Worker config
        run: node scripts/render-mesoscale-wrangler.mjs cloudflare/wrangler.mesoscale.jsonc cloudflare/wrangler.mesoscale.rendered.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESOSCALE_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MESOSCALE_PUBLIC_BASE_URL: ${{ vars.MESOSCALE_WORKER_URL }}

      - name: Deploy mesoscale Worker
        id: deploy
        run: pnpm dlx wrangler@4 deploy --config cloudflare/wrangler.mesoscale.rendered.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy scheduler Worker
        # Cloudflare cron that starts the ingest and beta release workflows (GitHub's own schedule is unreliable).
        # The Worker's GITHUB_DISPATCH_TOKEN secret comes from the MESOSCALE_DISPATCH_TOKEN repository
        # secret (a fine-grained token with only Actions: read and write on this repository). It is
        # piped to wrangler, never written to a file or the log. Without the repository secret the
        # existing Worker secret is left as it is.
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 deploy --config cloudflare/wrangler.mesoscale-scheduler.jsonc
          if [ -n "$MESOSCALE_DISPATCH_TOKEN" ]; then
            printf '%s' "$MESOSCALE_DISPATCH_TOKEN" | pnpm dlx wrangler@4 secret put GITHUB_DISPATCH_TOKEN --config cloudflare/wrangler.mesoscale-scheduler.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MESOSCALE_DISPATCH_TOKEN: ${{ secrets.MESOSCALE_DISPATCH_TOKEN }}

      - name: Smoke test mesoscale Worker
        env:
          MESOSCALE_WORKER_URL: ${{ vars.MESOSCALE_WORKER_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 20 "${MESOSCALE_WORKER_URL%/}/status") && printf '%s' "$body" | node -e 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));process.exit(Array.isArray(v.models)?0:1)'; then
              echo "Mesoscale Worker /status: $body"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Mesoscale Worker /status did not return a valid response."
          exit 1

      - name: Print rollback command on failure
        if: failure()
        run: echo "pnpm dlx wrangler@4 rollback --name gfc-mesoscale"

  # Clerk+D1 requests use the beta hostname's same-origin Worker API. Keep the
  # VPS service untouched as a rollback target; this path does not route traffic to it.
  deploy_beta_api:
    name: Deploy beta API server (VPS)
    needs: [release, deploy]
    if: >-
      !cancelled() &&
      needs.deploy.result == 'success' &&
      !inputs.dry_run &&
      (github.event_name == 'schedule' || inputs.deploy_api) &&
      inputs.auth_backend != 'clerk-d1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RSYNC_RSH: ssh -o StrictHostKeyChecking=yes
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Read app version
        id: app_version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_SSH_KEY }}

      - name: Trust VPS host key
        env:
          SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.BETA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if scan_output=$(ssh-keyscan -T 15 -p 22 -H "$SSH_HOST" 2>/tmp/ssh-keyscan.err) && [ -n "$scan_output" ]; then
                printf '%s\n' "$scan_output" >> ~/.ssh/known_hosts
                exit 0
              fi
              cat /tmp/ssh-keyscan.err >&2 || true
              if [ "$attempt" -lt 5 ]; then
                echo "ssh-keyscan attempt $attempt failed; retrying..." >&2
                sleep $((attempt * 5))
              fi
            done
            echo "ssh-keyscan failed after 5 attempts" >&2
            exit 1
          fi

      - name: Deploy analytics server via rsync
        env:
          BETA_SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
        run: |
          rsync -avz --exclude='node_modules' --exclude='logs' --exclude='.env' \
            server/ "root@${BETA_SSH_HOST}:/opt/gfc-beta-analytics/"

      - name: Write beta analytics env file
        env:
          BETA_SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          APP_VERSION: ${{ steps.app_version.outputs.value }}
          ADMIN_UID_ALLOWLIST: ${{ secrets.ADMIN_UID_ALLOWLIST }}
          METRICS_HASH_SALT: ${{ secrets.METRICS_HASH_SALT }}
          BETA_WORKER_SHARED_SECRET: ${{ secrets.BETA_WORKER_SHARED_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BETA_STRIPE_WEBHOOK_SECRET: ${{ secrets.BETA_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY: ${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL_STANDARD: ${{ secrets.STRIPE_PRICE_ANNUAL_STANDARD }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          cat > beta-server.env <<EOF
          PORT=3007
          LOG_DIR=/opt/gfc-beta-analytics/logs
          APP_BASE_URL=https://beta-gfc.weatherboysuper.com
          SERVER_TARGET=beta
          ADMIN_UID_ALLOWLIST=${ADMIN_UID_ALLOWLIST}
          METRICS_HASH_SALT=${METRICS_HASH_SALT}
          BETA_WORKER_SHARED_SECRET=${BETA_WORKER_SHARED_SECRET}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${BETA_STRIPE_WEBHOOK_SECRET}
          STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY}
          STRIPE_PRICE_ANNUAL_STANDARD=${STRIPE_PRICE_ANNUAL_STANDARD}
          STRIPE_PRICE_ANNUAL_PROMO=
          STRIPE_PROMO_START=
          STRIPE_PROMO_END=
          FIREBASE_ADMIN_PROJECT_ID=${FIREBASE_ADMIN_PROJECT_ID}
          FIREBASE_ADMIN_CLIENT_EMAIL=${FIREBASE_ADMIN_CLIENT_EMAIL}
          FIREBASE_ADMIN_PRIVATE_KEY=${FIREBASE_ADMIN_PRIVATE_KEY}
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_BROWSER_DSN=${VITE_SENTRY_DSN}
          SENTRY_ENVIRONMENT=beta
          SENTRY_RELEASE=graphical-forecast-creator@${APP_VERSION}
          EOF
          node scripts/write-deployment-env.mjs deploy/beta-deployment-config.json >> beta-server.env
          rsync -avz --chmod=F600 beta-server.env "root@${BETA_SSH_HOST}:/opt/gfc-beta-analytics/.env"

      - name: Install analytics dependencies and restart
        run: |
          ssh -o StrictHostKeyChecking=yes root@${{ secrets.BETA_SSH_HOST }} '
            cd /opt/gfc-beta-analytics
            npm install --omit=dev --quiet
            mkdir -p /opt/gfc-beta-analytics/logs
            if pm2 describe gfc-beta-analytics > /dev/null 2>&1; then
              pm2 restart gfc-beta-analytics
            else
              pm2 start analytics.js --name gfc-beta-analytics
            fi
            pm2 save
          '

  smoke_test:
    name: Smoke test beta site
    needs: [release, deploy, deploy_mesoscale_worker, deploy_beta_api]
    if: >-
      always() &&
      !cancelled() &&
      needs.deploy.result == 'success' &&
      (needs.deploy_mesoscale_worker.result == 'success' || needs.deploy_mesoscale_worker.result == 'skipped') &&
      (needs.deploy_beta_api.result == 'success' || needs.deploy_beta_api.result == 'skipped') &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          sparse-checkout: scripts/smoke-test-beta-site.mjs
          persist-credentials: false

      - name: Smoke test beta site
        env:
          BETA_ORIGIN: https://beta.gfcweather.com
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/smoke-test-beta-site.mjs

      - name: Smoke test the Clerk+D1 API
        if: inputs.auth_backend == 'clerk-d1'
        env:
          BETA_ORIGIN: https://beta.gfcweather.com
        run: |
          node --input-type=module - <<'NODE'
          let lastFailure = 'No response received.';
          let healthy = false;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const healthController = new AbortController();
            const healthTimeout = setTimeout(() => healthController.abort(), 15_000);
            try {
              const response = await fetch(`${process.env.BETA_ORIGIN || 'https://beta.gfcweather.com'}/api/health`, {
                headers: { 'Cache-Control': 'no-cache' }, signal: healthController.signal,
              });
              const text = await response.text();
              let body = {};
              try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 500) }; }
              lastFailure = `HTTP ${response.status}: ${JSON.stringify(body)}`;
              if (response.ok && body.service === 'gfc-beta-worker' && body.database === true) {
                const authController = new AbortController();
                const authTimeout = setTimeout(() => authController.abort(), 15_000);
                try {
                  const authProbe = await fetch(`${process.env.BETA_ORIGIN || 'https://beta.gfcweather.com'}/api/me/bootstrap`, {
                    headers: { 'Cache-Control': 'no-cache' }, signal: authController.signal,
                  });
                  if (authProbe.status === 401) healthy = true;
                  else lastFailure = `Health succeeded but unauthenticated bootstrap returned HTTP ${authProbe.status}.`;
                } finally { clearTimeout(authTimeout); }
              }
              if (healthy) {
                break;
              }
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error);
            } finally {
              clearTimeout(healthTimeout);
            }
            if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
          }
          if (!healthy) throw new Error(`Clerk+D1 API health check failed after 3 attempts: ${lastFailure}`);
          NODE

      - name: Print rollback command on smoke failure
        if: failure()
        env:
          AUTH_BACKEND: ${{ inputs.auth_backend || 'firebase' }}
        run: |
          echo "::error::Beta smoke test failed after deploy. Roll back the Worker with:"
          CONFIG="cloudflare/wrangler.beta.jsonc"
          if [ "$AUTH_BACKEND" = "clerk-d1" ]; then
            CONFIG="cloudflare/wrangler.beta.clerk-d1.generated.jsonc"
            echo "Set BETA_D1_DATABASE_ID in a repository checkout, then run: node scripts/prepare-beta-clerk-d1-config.mjs"
          fi
          echo "pnpm dlx wrangler@4.149.0 rollback --config $CONFIG"
          echo "To redeploy the tagged release without cutting a new version, run deploy-beta-workers.yml with ref=v${RELEASE_VERSION}."

  publish_release:
    name: Publish GitHub prerelease
    needs: [release, smoke_test]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.smoke_test.result == 'success' &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          sparse-checkout: |
            scripts/create-github-release.mjs
            scripts/lib
          persist-credentials: false

      - name: Publish draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs finalize "$RELEASE_VERSION"
