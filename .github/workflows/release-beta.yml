name: Release | Beta

# Beta releases are intentional snapshots of the next-major main line. Merging
# into main never creates a release automatically; this workflow versions the
# changelog, publishes a prerelease, deploys beta.gfcweather.com on Cloudflare
# Workers, and smoke-tests the live site.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE-BETA to create the prerelease'
        required: true
        type: string
      version:
        description: 'Optional explicit beta version (X.Y.Z-beta.N); leave blank to auto-increment'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Optional previous beta tag for generated release notes'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and preview release notes without committing, tagging, or deploying'
        required: false
        default: false
        type: boolean

concurrency:
  group: beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    if: inputs.confirmation == 'RELEASE-BETA'
    name: Lint and test main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  final_changelog_audit:
    if: inputs.confirmation == 'RELEASE-BETA' && !inputs.dry_run
    needs: quality
    name: Final changelog audit
    uses: ./.github/workflows/opencode-changelog-audit.yml
    with:
      target_ref: main
      force: true
      trigger_reason: beta-pre-release
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    permissions:
      contents: read
      issues: write
      pull-requests: read

  changelog_gate:
    name: Require clean changelog
    needs: final_changelog_audit
    if: inputs.confirmation == 'RELEASE-BETA' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Block release unless the final audit is clean
        env:
          AUDIT_RESULT: ${{ needs.final_changelog_audit.result }}
          AUDIT_STATUS: ${{ needs.final_changelog_audit.outputs.status }}
          TARGET_REF: main
          AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
        run: node scripts/require-opencode-changelog-clean.mjs

  release:
    name: Version, changelog, and GitHub prerelease
    needs: [quality, final_changelog_audit, changelog_gate]
    if: >-
      always() &&
      inputs.confirmation == 'RELEASE-BETA' &&
      needs.quality.result == 'success' &&
      (
        inputs.dry_run ||
        (
          needs.final_changelog_audit.result == 'success' &&
          needs.changelog_gate.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
      EXPLICIT_VERSION: ${{ inputs.version }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "RELEASE-BETA" ]; then
            echo "::error::Type RELEASE-BETA to create a beta release."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Calculate next beta version
        id: version
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -n "$AUDITED_HEAD" ] && [ "$(git rev-parse HEAD)" != "$AUDITED_HEAD" ]; then
            echo "::error::main moved after the final changelog audit; rerun the release workflow." >&2
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { calculateNextBetaVersion } from './scripts/lib/calculate-next-beta-version.mjs';

          const explicit = process.env.EXPLICIT_VERSION?.trim() ?? '';
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tags = execFileSync('git', ['tag', '--list', 'v*-beta.*'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          const taggedVersions = new Set(tags);
          const { version, strategy } = calculateNextBetaVersion({
            packageVersion: current,
            betaTags: tags,
            explicitVersion: explicit,
            taggedVersions,
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstrategy=${strategy}\n`);
          console.log(`Selected beta version ${version} (${strategy}).`);
          NODE

      - name: Preview beta release files (dry run)
        if: inputs.dry_run
        run: node scripts/prepare-beta-release.mjs "${{ steps.version.outputs.version }}" --dry-run

      - name: Prepare beta release commit
        if: !inputs.dry_run
        run: node scripts/prepare-beta-release.mjs "${{ steps.version.outputs.version }}"

      - name: Commit release metadata to main
        if: !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::No release file changes were produced." >&2
            exit 1
          fi
          git commit -m "chore(release): prepare ${{ steps.version.outputs.version }}"
          git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin HEAD:main

      - name: Validate beta package version
        if: !inputs.dry_run
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq -- '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "::error::Beta release requires a -beta.N package version, got $VERSION" >&2
            exit 1
          fi
          echo "Releasing beta version $VERSION from main"

      - name: Preview GitHub release notes (dry run)
        if: inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: beta-release-notes.md
          DRY_RUN: true
        run: |
          set -euo pipefail
          node scripts/prepare-beta-release.mjs "${{ steps.version.outputs.version }}"
          node scripts/create-github-release.mjs "${{ steps.version.outputs.version }}" main
          if [ -f beta-release-notes.md ]; then
            echo '### Dry-run release notes preview' >> "$GITHUB_STEP_SUMMARY"
            cat beta-release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout -- package.json CHANGELOG.md

      - name: Create GitHub prerelease
        if: !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: beta-release-notes.md
        run: node scripts/create-github-release.mjs "${{ steps.version.outputs.version }}" main

  deploy:
    name: Deploy beta Worker
    needs: release
    if: needs.release.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Verify beta release tag and package version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "v${RELEASE_VERSION}" ]; then
            echo "::error::Release artifact version ${PKG} does not match v${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build beta frontend
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_MODE: true
          VITE_BETA_INVITE_PATH: ${{ secrets.BETA_INVITE_PATH }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_UMAMI_HOST: ${{ secrets.VITE_UMAMI_HOST }}
          VITE_UMAMI_BETA_WEBSITE_ID: ${{ secrets.VITE_UMAMI_BETA_WEBSITE_ID }}
          VITE_UMAMI_PRODUCTION_WEBSITE_ID: ${{ secrets.VITE_UMAMI_PRODUCTION_WEBSITE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: false

      - name: Verify Sentry sourcemap publication
        run: node scripts/verify-sentry-sourcemaps.mjs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy beta Worker and static assets
        id: deploy
        run: pnpm dlx wrangler@4 deploy --config cloudflare/wrangler.beta.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test beta site
        id: smoke
        env:
          BETA_ORIGIN: https://beta.gfcweather.com
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/smoke-test-beta-site.mjs

      - name: Print rollback command on smoke failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Beta smoke test failed after deploy. Roll back with:"
          echo "pnpm dlx wrangler@4 rollback --config cloudflare/wrangler.beta.jsonc"
          echo "(Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID locally or in CI.)"

  dry_run_build:
    name: Dry-run beta build
    needs: release
    if: needs.release.result == 'success' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply dry-run version to the build artifact
        run: npm version "${{ needs.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build beta frontend (dry run)
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_MODE: true
          VITE_BETA_INVITE_PATH: ${{ secrets.BETA_INVITE_PATH }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_UMAMI_HOST: ${{ secrets.VITE_UMAMI_HOST }}
          VITE_UMAMI_BETA_WEBSITE_ID: ${{ secrets.VITE_UMAMI_BETA_WEBSITE_ID }}
          VITE_UMAMI_PRODUCTION_WEBSITE_ID: ${{ secrets.VITE_UMAMI_PRODUCTION_WEBSITE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: false
