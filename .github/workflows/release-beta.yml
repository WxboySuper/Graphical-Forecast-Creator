name: Release | Beta

# Beta releases are intentional snapshots of the next-major main line. Merging
# into main never creates a release automatically; this workflow versions main,
# publishes a draft GitHub prerelease, deploys beta.gfcweather.com on Cloudflare
# Workers, deploys the beta API on the VPS, smoke-tests, then publishes the release.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE-BETA to create the prerelease'
        required: true
        type: string
      version:
        description: 'Optional explicit beta version (X.Y.Z-beta.N); leave blank to auto-increment'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Optional previous beta tag for generated release notes'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and preview release notes without committing, tagging, or deploying'
        required: false
        default: false
        type: boolean
      deploy_api:
        description: 'Deploy the beta analytics/API server on the VPS after the Worker deploy'
        required: false
        default: true
        type: boolean

concurrency:
  group: beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE-BETA'
    name: Lint and test main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  final_changelog_audit:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE-BETA' && !inputs.dry_run
    needs: quality
    name: Final changelog audit
    uses: ./.github/workflows/opencode-changelog-audit.yml
    with:
      target_ref: main
      force: true
      trigger_reason: beta-pre-release
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    permissions:
      contents: read
      issues: write
      pull-requests: read

  changelog_gate:
    name: Require clean changelog
    needs: final_changelog_audit
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE-BETA' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Block release unless the final audit is clean
        env:
          AUDIT_RESULT: ${{ needs.final_changelog_audit.result }}
          AUDIT_STATUS: ${{ needs.final_changelog_audit.outputs.status }}
          TARGET_REF: main
          AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
        run: node scripts/require-opencode-changelog-clean.mjs

  version_gate:
    name: Resolve beta version
    needs: [quality, final_changelog_audit, changelog_gate]
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RELEASE-BETA' &&
      needs.quality.result == 'success' &&
      (
        inputs.dry_run ||
        (
          needs.final_changelog_audit.result == 'success' &&
          needs.changelog_gate.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
      EXPLICIT_VERSION: ${{ inputs.version }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "RELEASE-BETA" ]; then
            echo "::error::Type RELEASE-BETA to create a beta release."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Calculate next beta version
        id: version
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -n "$AUDITED_HEAD" ] && [ "$(git rev-parse HEAD)" != "$AUDITED_HEAD" ]; then
            echo "::error::main moved after the final changelog audit; rerun the release workflow." >&2
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { calculateNextBetaVersion } from './scripts/lib/calculate-next-beta-version.mjs';
          import { validateChangelogLaneForRelease } from './scripts/lib/changelog-lane-content.mjs';

          const explicit = process.env.EXPLICIT_VERSION?.trim() ?? '';
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tags = execFileSync('git', ['tag', '--list', 'v*-beta.*'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          validateChangelogLaneForRelease(readFileSync('CHANGELOG.md', 'utf8'), 'next-major');
          const { version, strategy } = calculateNextBetaVersion({
            packageVersion: current,
            betaTags: tags,
            explicitVersion: explicit,
            taggedVersions: new Set(tags),
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstrategy=${strategy}\n`);
          console.log(`Selected beta version ${version} (${strategy}).`);
          NODE

      - name: Preview beta package bump (dry run)
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-beta-release.mjs "$RELEASE_VERSION" --dry-run

      - name: Preview GitHub release notes (dry run)
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: beta-release-notes.md
          DRY_RUN: true
        run: |
          set -euo pipefail
          node scripts/create-github-release.mjs "$RELEASE_VERSION" main
          if [ -f beta-release-notes.md ]; then
            echo '### Dry-run release notes preview' >> "$GITHUB_STEP_SUMMARY"
            cat beta-release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

  pre_build:
    name: Pre-release build (no Sentry upload)
    needs: version_gate
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE-BETA' && needs.version_gate.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version_gate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply target beta version for build validation
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Build beta frontend (validation only)
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_MODE: true
          VITE_BETA_INVITE_PATH: ${{ secrets.BETA_INVITE_PATH }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_UMAMI_HOST: ${{ secrets.VITE_UMAMI_HOST }}
          VITE_UMAMI_BETA_WEBSITE_ID: ${{ secrets.VITE_UMAMI_BETA_WEBSITE_ID }}
          VITE_UMAMI_PRODUCTION_WEBSITE_ID: ${{ secrets.VITE_UMAMI_PRODUCTION_WEBSITE_ID }}
          CI: false

  release:
    name: Commit version and create draft GitHub release
    needs: [version_gate, pre_build]
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RELEASE-BETA' &&
      needs.version_gate.result == 'success' &&
      needs.pre_build.result == 'success' &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version_gate.outputs.version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    env:
      RELEASE_VERSION: ${{ needs.version_gate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Prepare beta package version
        run: node scripts/prepare-beta-release.mjs "$RELEASE_VERSION"

      - name: Commit release metadata to main
        id: release_commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          if git diff --cached --quiet; then
            echo "::error::No package.json version change was produced." >&2
            exit 1
          fi
          git commit -m "chore(release): prepare ${RELEASE_VERSION}"
          git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub prerelease
        env:
          RELEASE_COMMIT_SHA: ${{ steps.release_commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: next-major
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: beta-release-notes.md
          RELEASE_DRAFT: true
        run: node scripts/create-github-release.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA"

  deploy:
    name: Deploy beta Worker
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Verify beta release tag and package version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "v${RELEASE_VERSION}" ]; then
            echo "::error::Release artifact version ${PKG} does not match v${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build beta frontend
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_MODE: true
          VITE_BETA_INVITE_PATH: ${{ secrets.BETA_INVITE_PATH }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_UMAMI_HOST: ${{ secrets.VITE_UMAMI_HOST }}
          VITE_UMAMI_BETA_WEBSITE_ID: ${{ secrets.VITE_UMAMI_BETA_WEBSITE_ID }}
          VITE_UMAMI_PRODUCTION_WEBSITE_ID: ${{ secrets.VITE_UMAMI_PRODUCTION_WEBSITE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: false

      - name: Verify Sentry sourcemap publication
        run: node scripts/verify-sentry-sourcemaps.mjs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy beta Worker and static assets
        id: deploy
        run: pnpm dlx wrangler@4 deploy --config cloudflare/wrangler.beta.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Print rollback command on deploy failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Worker deploy failed. After fixing the issue, redeploy with deploy-beta-workers.yml and ref=v${RELEASE_VERSION}."
          echo "pnpm dlx wrangler@4 rollback --config cloudflare/wrangler.beta.jsonc"

  deploy_beta_api:
    name: Deploy beta API server (VPS)
    needs: [release, deploy]
    if: >-
      !cancelled() &&
      needs.deploy.result == 'success' &&
      !inputs.dry_run &&
      inputs.deploy_api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RSYNC_RSH: ssh -o StrictHostKeyChecking=yes
    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Read app version
        id: app_version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_SSH_KEY }}

      - name: Trust VPS host key
        env:
          SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.BETA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if scan_output=$(ssh-keyscan -T 15 -p 22 -H "$SSH_HOST" 2>/tmp/ssh-keyscan.err) && [ -n "$scan_output" ]; then
                printf '%s\n' "$scan_output" >> ~/.ssh/known_hosts
                exit 0
              fi
              cat /tmp/ssh-keyscan.err >&2 || true
              if [ "$attempt" -lt 5 ]; then
                echo "ssh-keyscan attempt $attempt failed; retrying..." >&2
                sleep $((attempt * 5))
              fi
            done
            echo "ssh-keyscan failed after 5 attempts" >&2
            exit 1
          fi

      - name: Deploy analytics server via rsync
        run: |
          rsync -avz --exclude='node_modules' --exclude='logs' \
            server/ root@${{ secrets.BETA_SSH_HOST }}:/opt/gfc-beta-analytics/

      - name: Write beta analytics env file
        run: |
          cat > beta-server.env <<EOF
          PORT=3007
          LOG_DIR=/opt/gfc-beta-analytics/logs
          APP_BASE_URL=https://beta-gfc.weatherboysuper.com
          SERVER_TARGET=beta
          BETA_MODE=true
          BETA_INVITE_TOKEN=${{ secrets.BETA_INVITE_TOKEN }}
          BETA_INVITE_PATH=${{ secrets.BETA_INVITE_PATH }}
          ADMIN_UID_ALLOWLIST=${{ secrets.ADMIN_UID_ALLOWLIST }}
          METRICS_HASH_SALT=${{ secrets.METRICS_HASH_SALT }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.BETA_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY=${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_ANNUAL_STANDARD=${{ secrets.STRIPE_PRICE_ANNUAL_STANDARD }}
          STRIPE_PRICE_ANNUAL_PROMO=
          STRIPE_PROMO_START=
          STRIPE_PROMO_END=
          FIREBASE_ADMIN_PROJECT_ID=${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL=${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY=${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_BROWSER_DSN=${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT=beta
          SENTRY_RELEASE=graphical-forecast-creator@${{ steps.app_version.outputs.value }}
          EOF
          node scripts/write-deployment-env.mjs deploy/beta-deployment-config.json >> beta-server.env
          rsync -avz beta-server.env root@${{ secrets.BETA_SSH_HOST }}:/opt/gfc-beta-analytics/.env

      - name: Install analytics dependencies and restart
        run: |
          ssh -o StrictHostKeyChecking=yes root@${{ secrets.BETA_SSH_HOST }} '
            cd /opt/gfc-beta-analytics
            npm install --omit=dev --quiet
            mkdir -p /opt/gfc-beta-analytics/logs
            if pm2 describe gfc-beta-analytics > /dev/null 2>&1; then
              pm2 restart gfc-beta-analytics
            else
              pm2 start analytics.js --name gfc-beta-analytics
            fi
            pm2 save
          '

  smoke_test:
    name: Smoke test beta site
    needs: [release, deploy, deploy_beta_api]
    if: >-
      always() &&
      !cancelled() &&
      needs.deploy.result == 'success' &&
      (needs.deploy_beta_api.result == 'success' || needs.deploy_beta_api.result == 'skipped') &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout smoke test script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          sparse-checkout: scripts/smoke-test-beta-site.mjs
          persist-credentials: false

      - name: Smoke test beta site
        env:
          BETA_ORIGIN: https://beta.gfcweather.com
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/smoke-test-beta-site.mjs

      - name: Print rollback command on smoke failure
        if: failure()
        run: |
          echo "::error::Beta smoke test failed after deploy. Roll back the Worker with:"
          echo "pnpm dlx wrangler@4 rollback --config cloudflare/wrangler.beta.jsonc"
          echo "To redeploy the tagged release without cutting a new version, run deploy-beta-workers.yml with ref=v${RELEASE_VERSION}."

  publish_release:
    name: Publish GitHub prerelease
    needs: [release, smoke_test]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.smoke_test.result == 'success' &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          sparse-checkout: |
            scripts/create-github-release.mjs
            scripts/lib
          persist-credentials: false

      - name: Publish draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-github-release.mjs finalize "$RELEASE_VERSION"
