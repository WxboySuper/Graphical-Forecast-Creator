name: Release | Bootstrap Stable Release Line

# Create the immutable stable branch only after the reviewed promotion PR has
# merged into main. This workflow never deploys, publishes, or merges a release.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Approved main commit or branch to use as the stable source'
        required: true
        default: main
        type: string
      version:
        description: 'Stable version (auto reads package.json)'
        required: true
        default: auto
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stable-bootstrap
      cancel-in-progress: false
    environment: production-promote
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout approved source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and stable branch contract
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TARGET_VERSION" = "auto" ]; then
            TARGET_VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { deriveStableVersion } from './scripts/lib/package-version.mjs'; console.log(deriveStableVersion(JSON.parse(readFileSync('package.json')).version) ?? '')" 2>/dev/null || true)
            if [ -z "$TARGET_VERSION" ]; then
              echo '::error::Cannot derive a stable version from package.json.' >&2
              exit 1
            fi
            echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"
          fi

          if ! printf '%s' "$SOURCE_REF" | grep -Eq '^(main|[0-9a-f]{7,40})$'; then
            echo "::error::Stable source must be main or an immutable commit SHA."
            exit 1
          fi

          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.0$'; then
            echo "::error::Stable version must be a padded flat X.Y.0 version, got $TARGET_VERSION."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$TARGET_VERSION" ]; then
            echo "::error::package.json is ${PACKAGE_VERSION}; merge the promotion PR (package must be stable ${TARGET_VERSION}) before bootstrapping."
            exit 1
          fi

          STABLE_BRANCH="stable/${TARGET_VERSION%%.*}.x"
          if git ls-remote --exit-code --heads origin "$STABLE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Stable branch $STABLE_BRANCH already exists; refusing to overwrite it."
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          echo "stable_branch=$STABLE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Preparing $STABLE_BRANCH from $SOURCE_SHA."

      - name: Create and push stable branch
        shell: bash
        env:
          STABLE_BRANCH: ${{ steps.validate.outputs.stable_branch }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          echo "::add-mask::$GIT_AUTH_HEADER"
          git switch --create "$STABLE_BRANCH" "$SOURCE_SHA"
          git -c "http.https://github.com/.extraheader=$GIT_AUTH_HEADER" push --set-upstream origin "$STABLE_BRANCH"
          echo "Created $STABLE_BRANCH at $SOURCE_SHA."

      - name: Prepare next-major version on main
        id: next_major
        env:
          STABLE_MAJOR: ${{ steps.validate.outputs.stable_branch }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          echo "::add-mask::$GIT_AUTH_HEADER"
          if ! printf '%s' "$STABLE_MAJOR" | grep -Eq '^stable/[0-9]+\.x$'; then
            echo "::error::Stable branch must match stable/X.x, got $STABLE_MAJOR."
            exit 1
          fi
          MAJOR=$(printf '%s' "$STABLE_MAJOR" | sed -E 's#stable/([0-9]+)\.x#\1#')
          NEXT_MAJOR=$((MAJOR + 1))
          git -c "http.https://github.com/.extraheader=$GIT_AUTH_HEADER" fetch origin main
          git switch --create "advance-main-v${NEXT_MAJOR}" origin/main
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')" "${NEXT_MAJOR}.0.0-beta.1"
          git add package.json
          git commit -m "chore(release): start v${NEXT_MAJOR} beta line"
          git -c "http.https://github.com/.extraheader=$GIT_AUTH_HEADER" push --set-upstream origin HEAD
          echo "version=${NEXT_MAJOR}.0.0-beta.1" >> "$GITHUB_OUTPUT"

      - name: Open next-major version PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NEXT_VERSION: ${{ steps.next_major.outputs.version }}
        run: |
          echo "::add-mask::$GH_PAT"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "advance-main-v${NEXT_VERSION%%.*}" --title "chore(release): start v${NEXT_VERSION%%.*} beta line" --body $'Set package.json to '"${NEXT_VERSION}"$' after bootstrapping stable/${{ steps.validate.outputs.stable_branch }}. The promotion PR already reset the next-major changelog lane.\n\nChangelog-Impact: none\nChangelog-Reason: Start the next major beta version after the stable line is cut.'
