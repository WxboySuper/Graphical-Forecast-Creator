name: Release | Prepare Stable Promotion

# This prepares a reviewed promotion PR on main. It does not create a release,
# deploy production, create a stable branch, or merge anything.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed main commit or branch to promote'
        required: true
        default: main
        type: string
      version:
        description: 'Stable version (auto reads package.json)'
        required: true
        default: auto
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: stable-promotion
      cancel-in-progress: false
    environment: production-promote
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      TARGET_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout source main ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve target version
        run: |
          if [ "$TARGET_VERSION" = "auto" ]; then
            VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { deriveStableVersion } from './scripts/lib/package-version.mjs'; console.log(deriveStableVersion(JSON.parse(readFileSync('package.json')).version) ?? '')")
            test -n "$VERSION" || { echo '::error::Cannot derive a stable version from package.json.'; exit 1; }
            echo "TARGET_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Create promotion branch
        id: branch
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_REF" | grep -Eq '^(main|[0-9a-f]{7,40})$'; then
            echo "::error::Stable promotion source must be main or an immutable commit SHA."
            exit 1
          fi
          BRANCH="promotion/v${TARGET_VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Promotion branch $BRANCH already exists; refusing to overwrite it."
            exit 1
          fi
          git switch --create "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Prepare reviewed stable promotion files
        run: node scripts/prepare-stable-promotion.mjs "$TARGET_VERSION"

      - name: Commit and push promotion branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git add package.json deploy/production-release.json CHANGELOG.md
          git commit -m "release: prepare v${TARGET_VERSION} stable promotion"
          GIT_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          echo "::add-mask::$GIT_AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=$GIT_AUTH_HEADER" push --set-upstream origin "${{ steps.branch.outputs.branch }}"

      - name: Open draft promotion PR
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_BODY: |-
            ## Main → stable promotion

            Prepare the reviewed `main` next-major line for stable release `v${{ inputs.version }}`.

            Source ref: `${{ inputs.source_ref }}`

            This PR only prepares version, production release metadata, and release notes. It does not deploy. After this merges into `main`, bootstrap `stable/<flat-major>.x` from that exact main commit, then use the manual stable release workflow.

            Changelog-Impact: beta
        run: |
          echo "::add-mask::$GH_PAT"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --draft \
            --title "release: prepare v${{ inputs.version }} stable promotion" \
            --body "$PR_BODY"
