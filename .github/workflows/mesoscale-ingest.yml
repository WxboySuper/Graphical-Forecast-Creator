name: Mesoscale ingest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: mesoscale-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    if: github.event_name != 'schedule' || vars.MESOSCALE_INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [hrrr, rap, rrfs]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/mesoscale/requirements.txt
      - name: Cache ecCodes definitions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/eccodes
          key: eccodes-${{ runner.os }}-2.41.0
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev libproj-dev
      - name: Install Python dependencies
        run: python -m pip install --requirement scripts/mesoscale/requirements.txt
      - name: Ingest model cycle
        env:
          MODEL: ${{ matrix.model }}
          # Use Ubuntu's libeccodes build with JPEG support, not the no-JPEG wheel copy.
          FINDLIBS_DISABLE_PACKAGE: 'yes'
          FINDLIBS_DISABLE_PYTHON: 'yes'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/mesoscale/ingest.py --model "$MODEL"
