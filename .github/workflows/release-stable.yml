name: Release | Stable

# Stable releases are created only from an approved stable/* release line.
# The published release then activates the production deployment workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Stable branch, tag, or commit to release'
        required: true
        default: stable/1.6.x
        type: string
      confirmation:
        description: 'Type RELEASE-STABLE to create the production release'
        required: true
        type: string
      previous_tag:
        description: 'Optional previous stable tag; leave blank to detect it'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  final_changelog_audit:
    if: inputs.confirmation == 'RELEASE-STABLE' && startsWith(inputs.ref, 'stable/')
    name: Final changelog audit
    uses: ./.github/workflows/opencode-changelog-audit.yml
    with:
      target_ref: ${{ inputs.ref }}
      force: true
      trigger_reason: stable-pre-release
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    permissions:
      contents: read
      issues: write
      pull-requests: read

  changelog_gate:
    name: Require clean changelog
    needs: final_changelog_audit
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Block release unless the final audit is clean
        env:
          AUDIT_RESULT: ${{ needs.final_changelog_audit.result }}
          AUDIT_STATUS: ${{ needs.final_changelog_audit.outputs.status }}
          TARGET_REF: ${{ inputs.ref }}
          AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
        run: node scripts/require-opencode-changelog-clean.mjs

  release:
    needs: [final_changelog_audit, changelog_gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_REF: ${{ inputs.ref }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMATION" != "RELEASE-STABLE" ]; then
            echo "::error::Type RELEASE-STABLE to create a production release."
            exit 1
          fi

      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Prepare stable package version
        id: version
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$AUDITED_HEAD" ]; then
            echo "::error::${RELEASE_REF} moved after the final changelog audit; rerun the release workflow." >&2
            exit 1
          fi
          case "$RELEASE_REF" in
            stable/*) ;;
            *) echo "::error::Stable releases must come from stable/*, got $RELEASE_REF" >&2; exit 1 ;;
          esac

          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+)\.0-beta\.[0-9]+$ ]]; then
            VERSION="${BASH_REMATCH[1]}.0"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json
            git commit -m "chore(release): prepare ${VERSION}"
            git push origin "HEAD:${RELEASE_REF}"
          elif printf '%s' "$CURRENT" | grep -Eq -- '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION="$CURRENT"
          else
            echo "::error::Stable release requires a stable semver or a beta prerelease package version, got $CURRENT" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing stable version $VERSION from $RELEASE_REF"

      - name: Create GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: stable-hotfix
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          NOTES_FILE: stable-release-notes.md
        run: node scripts/create-github-release.mjs "${{ steps.version.outputs.version }}" "$RELEASE_REF"
