name: Release | Stable

# Stable releases resolve a stable line, then publish after one `production-promote` environment approval.
# The approval job gates the audit, and the release job needs the audit, so one click covers the whole run.
# Publishing triggers the app Worker, marketing Worker, and VPS API deploy workflow.
on:
  workflow_dispatch:
    inputs:
      line:
        description: 'Stable line to release, or auto for the highest existing stable/N.x branch'
        required: true
        default: auto
        type: string
      dry_run:
        description: 'Show the release decision without changing or publishing anything'
        required: true
        default: false
        type: boolean
      previous_tag:
        description: 'Optional previous stable tag; leave blank to detect it'
        required: false
        default: ''
        type: string
      baseline_ref:
        description: 'Full commit SHA or version tag the final changelog audit starts from. It must be an ancestor of the release line. The default is the last clean audit of stable/2.x; the first v2 release has no earlier v2.x tag to fall back to.'
        required: false
        default: '237df100ff54bb373b730e9bac084b8830247310'
        type: string

permissions:
  contents: read

jobs:
  resolve_line:
    name: Resolve stable line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.line.outputs.ref }}
    steps:
      - name: Resolve requested line
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          BRANCHES=$(gh api "repos/${REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name')
          if [[ "$LINE" == auto ]]; then
            STABLE_BRANCHES=$(printf '%s\n' "$BRANCHES" | grep -E '^stable/[0-9]+\.x$' || true)
            REF=$(printf '%s\n' "$STABLE_BRANCHES" | sed -E 's#stable/([0-9]+)\.x#\1#' | sort -n | tail -1)
            if [ -z "$REF" ]; then echo '::error::No stable/N.x branches exist.'; exit 1; fi
            REF="stable/${REF}.x"
          elif [[ "$LINE" =~ ^([0-9]+)\.x$ ]]; then
            REF="stable/${LINE}"
          else
            echo "::error::line must be auto or N.x, got $LINE"; exit 1
          fi
          if ! printf '%s\n' "$BRANCHES" | grep -Fxq "$REF"; then
            echo "::error::Stable branch ${REF} does not exist."; exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved stable line: $REF"

  production_approval:
    needs: resolve_line
    name: Approve production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-promote
    steps:
      - run: echo "Approved production release for ${{ needs.resolve_line.outputs.ref }}"

  final_changelog_audit:
    needs: [resolve_line, production_approval]
    name: Final changelog audit
    uses: ./.github/workflows/opencode-changelog-audit.yml
    with:
      target_ref: ${{ needs.resolve_line.outputs.ref }}
      force: true
      baseline_ref: ${{ inputs.baseline_ref }}
      trigger_reason: stable-pre-release
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    permissions:
      contents: read
      issues: write
      pull-requests: read

  changelog_gate:
    name: Require clean changelog
    needs: [resolve_line, final_changelog_audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Block release unless the final audit is clean
        env:
          AUDIT_RESULT: ${{ needs.final_changelog_audit.result }}
          AUDIT_STATUS: ${{ needs.final_changelog_audit.outputs.status }}
          TARGET_REF: ${{ needs.resolve_line.outputs.ref }}
          AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
        run: node scripts/require-opencode-changelog-clean.mjs

  release:
    needs: [resolve_line, final_changelog_audit, changelog_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_REF: ${{ needs.resolve_line.outputs.ref }}
      AUDITED_HEAD: ${{ needs.final_changelog_audit.outputs.head_sha }}
    steps:
      - name: Checkout release line
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve_line.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Resolve version and prepare release files
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^stable/([0-9]+)\.x$ ]]; then
            echo "::error::Stable releases must come from stable/N.x, got $RELEASE_REF"; exit 1
          fi
          LINE_MAJOR="${BASH_REMATCH[1]}"
          if [ "$(git rev-parse HEAD)" != "$AUDITED_HEAD" ]; then
            echo "::error::${RELEASE_REF} moved after the final changelog audit; rerun the release workflow." >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "${CURRENT%%.*}" != "$LINE_MAJOR" ]; then
            echo "::error::package.json ${CURRENT} is not on the ${RELEASE_REF} major; refusing to release."; exit 1
          fi
          TARGET_VERSION=$(printf '%s' "$CURRENT" | sed -E 's/-beta\.[0-9]+$//')
          TAG="v${TARGET_VERSION}"
          TAG_ARGS=()
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then TAG_ARGS+=(--tag-exists); fi
          MODE_ARGS=()
          if [ "$DRY_RUN" = true ]; then MODE_ARGS+=(--dry-run); fi
          node scripts/prepare-stable-release.mjs "${TAG_ARGS[@]}" "${MODE_ARGS[@]}"
          PREVIOUS_TAG="$REQUESTED_PREVIOUS_TAG"
          if [ -z "$PREVIOUS_TAG" ]; then
            # Only tags of this line's major: the first release of a major has none, and the release script then detects its own.
            PREVIOUS_TAG=$(git tag --list "v${LINE_MAJOR}.*" | grep -E "^v${LINE_MAJOR}\.[0-9]+\.0$" | sort -Vr | head -1 || true)
          fi
          echo "Resolved line: $RELEASE_REF"
          echo "Current version: $CURRENT"
          echo "Previous tag: ${PREVIOUS_TAG:-none}"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          VERSION=$(node -p "require('./package.json').version")
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json CHANGELOG.md deploy/production-release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare ${VERSION}"
            git push origin "HEAD:${RELEASE_REF}"
          fi

      - name: Stop after dry run
        if: inputs.dry_run
        run: echo 'Dry run complete. No push, tag, or release was created.'

      - name: Create GitHub stable release
        if: ${{ !inputs.dry_run }}
        env:
          # A PAT is required so publishing this release triggers the production deploy workflow.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_LANE: stable-hotfix
          RELEASE_NOTES_MODE: changelog-and-prs
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          NOTES_FILE: stable-release-notes.md
        run: node scripts/create-github-release.mjs "${{ steps.version.outputs.version }}" "$RELEASE_REF"
