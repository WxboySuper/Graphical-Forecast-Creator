name: Mesoscale feed health

# Fails when the mesoscale catalog Worker reports a stale or unhealthy model feed, so the failed run
# (which GitHub emails to the repository owner) is the alert. The Cloudflare scheduler Worker starts
# it every hour; the schedule below is only a backup and may be delayed by GitHub.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: mesoscale-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the check script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/check-mesoscale-health.mjs
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
      - name: Check the mesoscale feeds
        env:
          MESOSCALE_WORKER_URL: ${{ vars.MESOSCALE_WORKER_URL }}
        run: node scripts/check-mesoscale-health.mjs
