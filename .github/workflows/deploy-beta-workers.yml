name: Deploy beta to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Beta branch, tag, or commit to deploy'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-beta-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment ref
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_REF" ]; then
            echo "::error::A deployment ref is required."
            exit 1
          fi
          if [ "$DEPLOY_REF" = "main" ] || printf '%s' "$DEPLOY_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            exit 0
          fi
          echo "::error::Deploy only main or a beta release tag (vX.Y.Z-beta.N)."
          exit 1

      - name: Checkout selected beta ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      - name: Verify Cloudflare beta deployment files
        run: |
          set -euo pipefail
          for path in cloudflare/wrangler.beta.jsonc cloudflare/beta-worker.mjs; do
            if [ ! -f "$path" ]; then
              echo "::error::Ref ${{ inputs.ref }} is missing ${path}. Beta tags from before the Cloudflare Workers migration cannot be deployed with this workflow."
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build beta frontend
        run: pnpm run build
        env:
          PUBLIC_URL: https://beta.gfcweather.com
          VITE_BUILD_TARGET: beta
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BETA_MODE: true
          VITE_BETA_INVITE_PATH: ${{ secrets.BETA_INVITE_PATH }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: beta
          VITE_UMAMI_HOST: ${{ secrets.VITE_UMAMI_HOST }}
          VITE_UMAMI_BETA_WEBSITE_ID: ${{ secrets.VITE_UMAMI_BETA_WEBSITE_ID }}
          VITE_UMAMI_PRODUCTION_WEBSITE_ID: ${{ secrets.VITE_UMAMI_PRODUCTION_WEBSITE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: false

      - name: Verify Sentry sourcemap publication
        run: node scripts/verify-sentry-sourcemaps.mjs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy beta Worker and static assets
        run: pnpm dlx wrangler@4 deploy --config cloudflare/wrangler.beta.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
