name: Maintenance | OpenCode changelog audit

on:
  workflow_call:
    inputs:
      target_ref:
        required: true
        type: string
      force:
        required: false
        type: boolean
      baseline_ref:
        required: false
        type: string
      release_tag:
        required: false
        type: string
      trigger_reason:
        required: false
        type: string
    secrets:
      OPENCODE_API_KEY:
        required: true
      GH_PAT:
        required: true
    outputs:
      status:
        description: Final result of the bounded audit.
        value: ${{ jobs.audit.outputs.status }}
      head_sha:
        description: Audited target revision.
        value: ${{ jobs.audit.outputs.head_sha }}
  schedule:
    - cron: '17 15 * * 5' # Weekly Friday afternoon UTC
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Release line to inspect'
        required: true
        default: main
        type: string
      force:
        description: 'Reinspect this revision even if it completed successfully before'
        required: false
        default: false
        type: boolean
      baseline_ref:
        description: 'Optional full commit SHA or version tag to bound this run; it must be an ancestor of the target head'
        required: false
        type: string
      release_tag:
        description: 'Optional just-published tag to exclude when selecting the previous release baseline'
        required: false
        type: string
      trigger_reason:
        description: 'Why this audit was queued'
        required: false
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: gfc-opencode-maintenance-queue
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      status: ${{ steps.context.outputs.run == 'true' && steps.persist.outputs.status || steps.context.outputs.status }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    env:
      TARGET_REF: ${{ inputs.target_ref || github.event.inputs.target_ref || 'main' }}
      FORCE_AUDIT: ${{ inputs.force || github.event.inputs.force || 'false' }}
      TRIGGER_REASON: ${{ inputs.trigger_reason || github.event.inputs.trigger_reason || github.event_name }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.inputs.release_tag || '' }}
      BASELINE_REF: ${{ inputs.baseline_ref || github.event.inputs.baseline_ref || '' }}
      STATE_MARKER: '<!-- gfc-opencode-maintenance-state:v1 -->'
      STATE_TITLE: '[Maintenance state] OpenCode job history'
    steps:
      - name: Check out trusted maintenance tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out the target release line
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.target_ref || github.event.inputs.target_ref || 'main' }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bounded changelog audit context and state
        id: context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CONTEXT_PATH: ${{ runner.temp }}/opencode-changelog-audit-context.json
          SOURCE_PATH: ${{ github.workspace }}/target-source
          STATE_PATH: ${{ runner.temp }}/opencode-changelog-audit-state.json
          TARGET_REF: ${{ env.TARGET_REF }}
          FORCE_AUDIT: ${{ env.FORCE_AUDIT }}
          TRIGGER_REASON: ${{ env.TRIGGER_REASON }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          BASELINE_REF: ${{ env.BASELINE_REF }}
          STATE_MARKER: ${{ env.STATE_MARKER }}
          STATE_TITLE: ${{ env.STATE_TITLE }}
        with:
          script: |
            const fs = require('fs')
            const { execFileSync } = require('child_process')
            const targetRef = process.env.TARGET_REF
            if (!/^(main|stable\/\d+\.\d+\.x)$/.test(targetRef)) throw new Error(`Unsupported changelog release line: ${targetRef}`)
            const { data: branch } = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: targetRef })
            const headSha = branch.commit.sha
            core.setOutput('head_sha', headSha)
            const gitOptions = { encoding: 'utf8', cwd: process.env.SOURCE_PATH }
            const head = execFileSync('git', ['rev-parse', 'HEAD'], gitOptions).trim()
            const checkedOut = head
            if (headSha !== checkedOut) throw new Error('Target branch moved before checkout completed; retry against the current revision.')

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            })
            let tracker = issues.find((item) => !item.pull_request && item.title === process.env.STATE_TITLE)
            if (!tracker) tracker = (await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: process.env.STATE_TITLE,
              body: 'Machine-readable state for bounded OpenCode maintenance workflows. Keep open. State is stored in the hidden comment below.',
            })).data
            if (tracker.state !== 'open') throw new Error(`Maintenance state issue #${tracker.number} is closed.`)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.number, per_page: 100,
            })
            const stateComment = comments.find((item) => item.user?.login === 'github-actions[bot]' && item.body?.startsWith(process.env.STATE_MARKER))
            const state = stateComment
              ? JSON.parse(stateComment.body.slice(process.env.STATE_MARKER.length).trim())
              : { version: 2, jobs: {}, reported: {}, changelogAudits: {} }
            state.version = 2
            state.changelogAudits ??= {}
            const audit = state.changelogAudits[targetRef] ?? {}

            const git = (args) => execFileSync('git', args, gitOptions).trim()
            const ancestor = (candidate) => {
              try { execFileSync('git', ['merge-base', '--is-ancestor', candidate, headSha], { cwd: process.env.SOURCE_PATH, stdio: 'ignore' }); return true }
              catch { return false }
            }
            const { pathToFileURL } = require('url')
            const auditHelper = require('path').join(process.env.GITHUB_WORKSPACE, 'scripts/lib/opencode-changelog-audit.mjs')
            const { resolveManualChangelogAuditBaseline } = await import(pathToFileURL(auditHelper).href)
            const manualBaselineSha = resolveManualChangelogAuditBaseline({
              baselineRef: process.env.BASELINE_REF,
              targetRef,
              headSha,
              resolveCommit: (ref) => git(['rev-parse', `${ref}^{commit}`]),
              isAncestor: ancestor,
            })

            if (audit.pendingPR?.number) {
              const { data: pending } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: audit.pendingPR.number,
              })
              if (pending.state === 'open') {
                core.notice(`Changelog audit PR #${pending.number} is already open.`)
                core.setOutput('run', 'false')
                core.setOutput('status', 'pr-opened')
                return
              }
              audit.pendingPR = null
              state.changelogAudits[targetRef] = audit
            }
            if (audit.lastInspectedHead === headSha && process.env.FORCE_AUDIT !== 'true' && !manualBaselineSha) {
              core.notice(`Changelog audit already completed for ${targetRef}@${headSha.slice(0, 10)}.`)
              core.setOutput('run', 'false')
              core.setOutput('status', 'clean')
              return
            }

            let baselineSha = manualBaselineSha ?? (audit.lastInspectedHead && ancestor(audit.lastInspectedHead) ? audit.lastInspectedHead : null)
            const line = targetRef === 'main' ? null : targetRef.match(/^stable\/(\d+\.\d+)\.x$/)[1]
            if (!baselineSha) {
              const tags = targetRef === 'main'
                ? git(['tag', '--merged', headSha, '--list', 'v*-beta.*', '--sort=-version:refname']).split(/\r?\n/).filter((tag) => /^v\d+\.\d+\.\d+-beta\.\d+$/.test(tag))
                : git(['tag', '--merged', headSha, '--list', `v${line}.*`, '--sort=-version:refname']).split(/\r?\n/).filter((tag) => new RegExp(`^v${line.replace('.', '\\.')}\\.\\d+$`).test(tag))
              const releaseTag = process.env.RELEASE_TAG
              if (releaseTag) {
                const index = tags.indexOf(releaseTag)
                if (index >= 0) tags.splice(index, 1)
              }
              baselineSha = tags.length ? git(['rev-parse', `${tags[0]}^{commit}`]) : null
            }
            if (!baselineSha) {
              const recent = git(['rev-list', '--max-count=51', headSha]).split(/\r?\n/).filter(Boolean)
              baselineSha = recent.length > 50 ? recent[50] : '4b825dc642cb6eb9a060e54bf8d69288fbee4904'
            }

            const laneHeading = targetRef === 'main' ? '### Next major / beta' : `### Stable ${line}.x hotfixes`
            const contextData = {
              trackerNumber: tracker.number,
              stateCommentId: stateComment?.id ?? null,
              state,
              targetRef,
              headSha,
              baselineSha,
              laneHeading,
              impact: targetRef === 'main' ? 'beta' : 'hotfix',
              triggerReason: process.env.TRIGGER_REASON,
            }
            state.lastAttempt = { category: 'changelog-audit', targetRef, baseline: baselineSha, head: headSha, at: new Date().toISOString(), status: 'started' }
            const body = `${process.env.STATE_MARKER}\n${JSON.stringify(state)}`
            if (contextData.stateCommentId) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: contextData.stateCommentId, body })
            } else {
              contextData.stateCommentId = (await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: tracker.number, body,
              })).data.id
            }
            fs.writeFileSync(process.env.CONTEXT_PATH, JSON.stringify(contextData), 'utf8')
            fs.writeFileSync(process.env.STATE_PATH, JSON.stringify(contextData), 'utf8')
            core.setOutput('run', 'true')
            core.setOutput('status', 'running')

      - name: Prepare evidence-bounded prompt
        id: task
        if: steps.context.outputs.run == 'true'
        env:
          CONTEXT_PATH: ${{ runner.temp }}/opencode-changelog-audit-context.json
          PROMPT_PATH: ${{ runner.temp }}/opencode-changelog-audit.md
          OUTPUT_PATH: ${{ runner.temp }}/opencode-changelog-audit-output.json
        working-directory: target-source
        run: node "$GITHUB_WORKSPACE/scripts/prepare-opencode-changelog-audit.mjs"

      - name: Prepare model-visible repository
        if: steps.context.outputs.run == 'true' && steps.task.outputs.run == 'true'
        working-directory: target-source
        run: node "$GITHUB_WORKSPACE/scripts/prepare-opencode-workspace.mjs"

      - name: Install pinned OpenCode CLI
        if: steps.context.outputs.run == 'true' && steps.task.outputs.run == 'true'
        run: npm install --global --no-audit --no-fund opencode-ai@1.18.32

      - name: Run read-only changelog audit
        if: steps.context.outputs.run == 'true' && steps.task.outputs.run == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"*":"deny","external_directory":{"*":"deny"},"read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow"},"glob":"allow","grep":"allow"}'
          OPENCODE_MODEL: opencode-go/muse-spark-1.3-contributor
          OPENCODE_PROMPT_PATH: ${{ runner.temp }}/opencode-changelog-audit.md
          OPENCODE_OUTPUT_PATH: ${{ runner.temp }}/opencode-changelog-audit-output.json
          OPENCODE_TIMEOUT_MS: 900000
        working-directory: target-source
        run: node "$GITHUB_WORKSPACE/scripts/run-opencode-maintenance.mjs"

      - name: Validate and publish a changelog PR
        if: steps.context.outputs.run == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTEXT_PATH: ${{ runner.temp }}/opencode-changelog-audit-context.json
          OUTPUT_PATH: ${{ runner.temp }}/opencode-changelog-audit-output.json
          RESULT_PATH: ${{ runner.temp }}/opencode-changelog-audit-result.json
          GH_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: target-source
        run: node "$GITHUB_WORKSPACE/scripts/publish-opencode-changelog-audit.mjs"

      - name: Persist changelog audit result
        id: persist
        if: steps.context.outputs.run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          CONTEXT_PATH: ${{ runner.temp }}/opencode-changelog-audit-context.json
          RESULT_PATH: ${{ runner.temp }}/opencode-changelog-audit-result.json
          STATE_PATH: ${{ runner.temp }}/opencode-changelog-audit-state.json
          STATE_MARKER: ${{ env.STATE_MARKER }}
        with:
          script: |
            const fs = require('fs')
            const prepared = JSON.parse(fs.readFileSync(process.env.CONTEXT_PATH, 'utf8'))
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'))
            const state = prepared.state
            state.changelogAudits ??= {}
            const audit = state.changelogAudits[prepared.targetRef] ?? {}
            if (result.status === 'pr-opened') {
              audit.pendingPR = { number: result.number, url: result.url, head: prepared.headSha, branch: result.branch }
            } else if (result.status === 'clean') {
              audit.lastInspectedHead = prepared.headSha
              audit.lastSuccessAt = new Date().toISOString()
              audit.pendingPR = null
            }
            state.changelogAudits[prepared.targetRef] = audit
            state.lastAttempt = {
              category: 'changelog-audit', targetRef: prepared.targetRef, head: prepared.headSha,
              baseline: prepared.baselineSha, at: new Date().toISOString(), status: result.status, pullRequest: result.url ?? null,
            }
            const body = `${process.env.STATE_MARKER}\n${JSON.stringify(state)}`
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prepared.stateCommentId, body })
            fs.writeFileSync(process.env.STATE_PATH, JSON.stringify(prepared), 'utf8')
            core.setOutput('status', result.status)
            const summary = result.status === 'pr-opened'
              ? `Opened [PR #${result.number}](${result.url}) for human review.`
              : result.status === 'inconclusive'
                ? 'The changelog could not be verified; a later run may retry.'
                : 'Changelog is current for this revision.'
            await core.summary.addHeading('OpenCode changelog audit').addRaw(summary).write()
            if (result.status === 'inconclusive') core.setFailed('Changelog audit was inconclusive; state records the result for a later retry.')

      - name: Record failed or inconclusive audit attempt
        if: failure() && steps.context.outputs.run == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          STATE_PATH: ${{ runner.temp }}/opencode-changelog-audit-state.json
          STATE_MARKER: ${{ env.STATE_MARKER }}
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync(process.env.STATE_PATH)) return
            const prepared = JSON.parse(fs.readFileSync(process.env.STATE_PATH, 'utf8'))
            if (prepared.state.lastAttempt?.status !== 'started') return
            prepared.state.lastAttempt.status = 'failed'
            prepared.state.lastAttempt.at = new Date().toISOString()
            const body = `${process.env.STATE_MARKER}\n${JSON.stringify(prepared.state)}`
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prepared.stateCommentId, body })
