# Install after production traffic has moved to the Cloudflare Worker.
# Keep API requests on this host so the Worker can proxy them to the VPS.
server {
    listen 80;
    server_name gfc.weatherboysuper.com;
    return 301 https://gfcweather.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gfc.weatherboysuper.com;

    ssl_certificate     /etc/letsencrypt/live/gfc.weatherboysuper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfc.weatherboysuper.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/sentry-tunnel {
        proxy_pass          http://127.0.0.1:3006/api/sentry-tunnel;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        client_max_body_size 100k;
        limit_except POST { deny all; }
    }

    location = /api {
        proxy_pass          http://127.0.0.1:3006/api;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass          http://127.0.0.1:3006;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location ^~ / {
        return 301 https://gfcweather.com$request_uri;
    }
}
